<!doctype html>
<meta charset="utf-8">
<title>A label that flips</title>
<style>
  body { font: 16px system-ui; margin: 24px; }
  .controls { display: flex; gap: 8px; align-items: center; }
  button { padding: 0 18px; }
</style>
<!-- The bug from the garden study: past halfway, the button's label changes and so does its
     width, so the slider beside it moves. -->
<div class="controls">
  <button id="play">Go</button>
  <input id="p" type="range" min="0" max="1" step="0.01" value="0" aria-label="How far">
</div>
<script>
  const play = document.getElementById("play");
  document.getElementById("p").oninput = (e) => { play.textContent = e.target.value > 0.5 ? "Come back" : "Go"; };
</script>
